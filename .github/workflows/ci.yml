name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GDD §3.5: the EV auditor runs in CI, not just at runtime.
      # v0 contract: logging only — surfaces degenerate boards without failing the build.
      - run: npm run audit:boards
